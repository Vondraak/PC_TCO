<!DOCTYPE html>
<html lang="en">
<head>

<title>Enlightened LED + Perfect Corp: TCO and Responsibilities</title>
<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3342; --text:#e6edf3; --muted:#8b98a9;

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:16px}

.layout{display:grid;grid-template-columns:260px 1fr;min-height:100vh}

nav a .cnt{font-size:11px;color:var(--open)}

main{padding:24px 32px 80px;max-width:1100px}
.toolbar{position:sticky;top:0;z-index:5;background:rgba(13,17,23,.94);backdrop-filter:blur(6px);padding:12px 0 12px;border-bottom:1px solid var(--line);margin-bottom:20px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.toolbar input[type=search]{flex:1 1 220px;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 10px;border-radius:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:4px 10px;border-radius:999px;cursor:pointer;font-size:12px;user-select:none}
.chip.on{color:#0d1117;font-weight:600}
.chip[data-k=all].on,.chip[data-s=all].on{background:var(--text)}
.chip[data-s=open].on{background:var(--open)} .chip[data-s=done].on{background:var(--done)}
.chip[data-k=ELED].on{background:var(--eled)} .chip[data-k=PC].on{background:var(--pc)}
.chip[data-k=SHARED].on{background:var(--both)} .chip[data-k=VENDOR].on{background:var(--vendor)} .chip[data-k=RETAIL].on{background:var(--retail)}
.btnrow{display:flex;gap:6px}
button{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:12px}
button:hover{border-color:var(--accent)}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:24px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
details.sec{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
details.sec>summary{list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;gap:10px}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"\25B8";color:var(--muted);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary h2{margin:0;font-size:17px;flex:1}
.pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--muted)}
.pill.o{color:var(--open)}
.body{padding:0 18px 16px}
.intro{color:var(--muted);margin:0 0 10px}
.item{display:grid;grid-template-columns:64px 1fr 74px;gap:12px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.tag{font-size:10.5px;font-weight:700;text-align:center;padding:2px 0;border-radius:4px;letter-spacing:.04em;margin-top:2px}
.tag.ELED{background:rgba(76,201,240,.15);color:var(--eled)} .tag.PC{background:rgba(183,148,246,.15);color:var(--pc)}
.tag.SHARED{background:rgba(246,196,83,.15);color:var(--both)} .tag.VENDOR{background:rgba(95,211,141,.15);color:var(--vendor)}
.tag.RETAIL{background:rgba(247,143,179,.15);color:var(--retail)}
.txt .note{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.item.open .txt .main{color:var(--text)}
.item.done .txt .main{color:#c9d4e0}
.st{font-size:11px;text-align:center;padding:2px 0;border-radius:4px;cursor:pointer;border:1px solid transparent;margin-top:2px;user-select:none}
.st.open{color:var(--open);border-color:rgba(246,160,90,.4)}
.st.done{color:var(--done);border-color:rgba(95,211,141,.4)}
.sub3{margin:16px 0 4px;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.callout{background:var(--panel2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 8px 8px 0;margin:10px 0;color:#c9d4e0}
.hidden{display:none!important}
/* TCO */
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
label.f{display:block;font-size:12px;color:var(--muted)}
input[type=number],input[type=text],select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:5px 8px;width:100%;font:inherit}
table{width:100%;border-collapse:collapse;margin-bottom:10px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:middle}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input,td select{min-width:0}
.tco-h{display:flex;justify-content:space-between;align-items:center;margin:16px 0 4px}
.tco-h h3{margin:0;font-size:14px;color:var(--accent)}
.totals{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:10px}
.tot{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.tot span{font-size:12px;color:var(--muted)} .tot b{display:block;font-size:20px}
.tot.hl{border-color:var(--accent)}
.x{color:var(--muted);cursor:pointer;background:none;border:0;font-size:15px}
.x:hover{color:#ff6b6b}
@media(max-width:860px){.layout{grid-template-columns:1fr}aside{position:static;height:auto}.item{grid-template-columns:56px 1fr}.st{grid-column:2}}
@media print{aside,.toolbar{display:none}.layout{display:block}details.sec{border:0}body{background:#fff;color:#000}}

// ---------- state ----------
const LS='eled-pc-tco-v1';
let saved={}; try{saved=JSON.parse(localStorage.getItem(LS)||'{}')}catch(e){}
saved.status=saved.status||{};
const persist=()=>{try{localStorage.setItem(LS,JSON.stringify(saved))}catch(e){}};
const state={q:'',owner:'all',status:'all'};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const key=(s,i)=>s.id+':'+i;
const stat=(s,i)=>saved.status[key(s,i)]||SECTIONS.find(x=>x.id===s).items[i].s;

// ---------- render ----------
function renderSections(){
  const host=document.getElementById('sections'); host.innerHTML='';
  SECTIONS.forEach(sec=>{
    const d=el('details','sec'); d.id=sec.id; d.open=true;
    const sm=el('summary'); sm.appendChild(el('h2','',sec.title));
    const p=el('span','pill o'); p.dataset.cnt=sec.id; sm.appendChild(p); d.appendChild(sm);
    const b=el('div','body'); if(sec.intro)b.appendChild(el('p','intro',sec.intro));
    sec.items.forEach((it,i)=>{
      const row=el('div','item'); row.dataset.sec=sec.id; row.dataset.i=i; row.dataset.owner=it.o;
      row.appendChild(el('div','tag '+it.o,OWNERS[it.o]));
      const t=el('div','txt'); t.appendChild(el('span','main',it.t));
      if(it.n)t.appendChild(el('span','note',it.n)); row.appendChild(t);
      const st=el('div','st'); st.title='Click to toggle open / answered';
      st.onclick=()=>{saved.status[key(sec.id,i)]=stat(sec.id,i)==='open'?'done':'open';persist();paint()};
      row.appendChild(st); b.appendChild(row);
    });
    if(sec.callout)b.appendChild(el('div','callout',sec.callout));
    d.appendChild(b); host.appendChild(d);
  });
  const tco=document.getElementById('tcoHost'); if(tco)host.appendChild(tco);
}

function paint(){
  const q=state.q.toLowerCase();
  let tOpen=0,tDone=0;
  SECTIONS.forEach(sec=>{
    let vis=0,open=0,done=0;
    document.querySelectorAll(`.item[data-sec="${sec.id}"]`).forEach(row=>{
      const i=+row.dataset.i, it=sec.items[i], s=stat(sec.id,i);
      row.classList.toggle('open',s==='open'); row.classList.toggle('done',s==='done');
      const st=row.querySelector('.st'); st.textContent=s==='open'?'Open':'Answered'; st.className='st '+s;
      const hay=(it.t+' '+(it.n||'')+' '+OWNER_NAMES[it.o]).toLowerCase();
      const show=(!q||hay.includes(q))&&(state.owner==='all'||it.o===state.owner)&&(state.status==='all'||s===state.status);
      row.classList.toggle('hidden',!show);
      if(show)vis++;
      if(s==='open')open++;else done++;
    });
    tOpen+=open;tDone+=done;
    const sd=document.getElementById(sec.id); sd.classList.toggle('hidden',vis===0);
    sd.querySelector('[data-cnt]').textContent=open+' open / '+(open+done);
    const nl=document.querySelector(`nav a[href="#${sec.id}"] .cnt`); if(nl)nl.textContent=open||'';
  });
  document.getElementById('summary').innerHTML='';
  [['Total items',tOpen+tDone],['Open',tOpen],['Answered',tDone]].forEach(([l,v])=>{
    const s=el('div','stat');s.appendChild(el('b','',v));s.appendChild(el('span','',l));document.getElementById('summary').appendChild(s)});
  ['ELED','PC','SHARED','VENDOR','RETAIL'].forEach(k=>{
    let n=0;SECTIONS.forEach(sec=>sec.items.forEach((it,i)=>{if(it.o===k&&stat(sec.id,i)==='open')n++}));
    const s=el('div','stat');s.appendChild(el('b','',n));s.appendChild(el('span','','Open: '+OWNER_NAMES[k].split(' (')[0]));document.getElementById('summary').appendChild(s)});
}

function renderNav(){
  const nav=document.getElementById('nav'); nav.innerHTML=''; let g='';
  SECTIONS.forEach(sec=>{
    if(sec.group!==g){g=sec.group;nav.appendChild(el('div','grp',g))}
    const a=el('a');a.href='#'+sec.id;a.appendChild(el('span','',sec.title));a.appendChild(el('span','cnt'));nav.appendChild(a);
  });
  nav.appendChild(el('div','grp','Cost'));
  const a=el('a');a.href='#tco';a.appendChild(el('span','','TCO calculator'));nav.appendChild(a);
}

function renderChips(){
  const oc=document.getElementById('ownerChips'); oc.innerHTML='';
  [['all','All owners'],['ELED','ELED'],['PC','Perfect'],['SHARED','Shared'],['VENDOR','Vendors'],['RETAIL','Retailer']].forEach(([k,l])=>{
    const c=el('span','chip'+(state.owner===k?' on':''),l);c.dataset.k=k;c.onclick=()=>{state.owner=k;renderChips();paint()};oc.appendChild(c)});
  const sc=document.getElementById('statusChips'); sc.innerHTML='';
  [['all','Any status'],['open','Open'],['done','Answered']].forEach(([k,l])=>{
    const c=el('span','chip'+(state.status===k?' on':''),l);c.dataset.s=k;c.onclick=()=>{state.status=k;renderChips();paint()};sc.appendChild(c)});
}

// ---------- TCO ----------
const FREQ={once:'One-time',monthly:'Monthly',quarterly:'Quarterly',annual:'Annual'};
const ANNUAL_MULT={monthly:12,quarterly:4,annual:1};
const DEFAULT_TCO={
  kiosks:1,years:3,margin:0,
  groups:[
   {id:'hw',title:'Per-kiosk hardware',freqs:['once'],rows:[
     ['3D display (MetaVista MV3D)','VENDOR'],['Compute (RTX 4060, Windows 11)','ELED'],['Camera(s)','ELED'],['Touchscreen (PQLabs, optional)','VENDOR'],
     ['Directional audio','ELED'],['Microphone','ELED'],['Enclosure / stand','ELED'],['Cabling and accessories','ELED'],['Shipping, install, commissioning','ELED']]},
   {id:'lic',title:'Per-kiosk licensing',freqs:['monthly','quarterly','annual','once'],rows:[
     ['Blink license','VENDOR'],['Grassfish license','VENDOR'],['PC modules / API keys (SKUs)','PC'],['OS and other software licenses','ELED']]},
   {id:'sup',title:'Ongoing support and monitoring',freqs:['monthly','quarterly','annual'],rows:[
     ['Remote monitoring and telemetry (Grassfish)','VENDOR'],['Tier 1 to 3 support','SHARED'],['Content curation and creation','ELED'],['Network operations','ELED'],
     ['Cloud hosting (if ELED hosts)','ELED'],['Hardware replacement / warranty reserve','ELED'],['Labor overhead and associate training','SHARED']]},
   {id:'one',title:'One-time services and integration (fleet-wide)',freqs:['once'],rows:[
     ['Integration build (vendor-funded; enter only ELED-borne cost)','VENDOR'],['UI build and EUX testing','ELED']]}
  ]
};
const mkRow=(g,[name,owner])=>({name,owner,cost:0,qty:1,freq:g.freqs[0],scope:g.id==='one'?'flat':'kiosk'});
function initTco(){
  if(saved.tco)return;
  saved.tco={kiosks:DEFAULT_TCO.kiosks,years:DEFAULT_TCO.years,margin:DEFAULT_TCO.margin,
    groups:DEFAULT_TCO.groups.map(g=>({id:g.id,title:g.title,freqs:g.freqs,rows:g.rows.map(r=>mkRow(g,r))}))};
}
const money=n=>n.toLocaleString(undefined,{style:'currency',currency:'USD',maximumFractionDigits:0});
function rowTotal(r,k){return (+r.cost||0)*(+r.qty||0)*(r.scope==='kiosk'?k:1)}

function renderTco(){
  initTco(); const T=saved.tco;
  let host=document.getElementById('tcoHost');
  if(!host){host=el('details','sec');host.id='tcoHost';host.open=true;}
  host.innerHTML='';
  const sm=el('summary');sm.id='tco';sm.appendChild(el('h2','','TCO calculator (ELED cost)'));host.appendChild(sm);
  const b=el('div','body');
  b.appendChild(el('p','intro','Enter real numbers once hardware is scoped with MV3D. Edits are saved in this browser. "Per kiosk" scales with the kiosk count; "Flat" is counted once.'));
  const inp=el('div','inputs');
  [['Number of kiosks','kiosks',1],['Evaluation term (years)','years',1],['Target margin on cost (%)','margin',0]].forEach(([l,k,min])=>{
    const w=el('label','f',l);const i=el('input');i.type='number';i.min=min;i.value=T[k];
    i.oninput=()=>{T[k]=+i.value||0;persist();updateTotals()};w.appendChild(i);inp.appendChild(w)});
  b.appendChild(inp);

  T.groups.forEach(g=>{
    const h=el('div','tco-h');h.appendChild(el('h3','',g.title));
    const add=el('button','','+ Add line');add.onclick=()=>{g.rows.push(mkRow(g,['New item','ELED']));persist();renderTco()};h.appendChild(add);b.appendChild(h);
    const tb=el('table');
    const hr=el('tr');['Item','Owner','Unit cost','Qty','Billing','Scope','Line total',''].forEach(x=>hr.appendChild(el('th','',x)));tb.appendChild(hr);
    g.rows.forEach((r,idx)=>{
      const tr=el('tr');
      const nm=el('input');nm.type='text';nm.value=r.name;nm.oninput=()=>{r.name=nm.value;persist()};
      const td1=el('td');td1.appendChild(nm);tr.appendChild(td1);
      const ow=el('select');Object.keys(OWNERS).forEach(o=>{const op=el('option','',OWNERS[o]);op.value=o;if(o===r.owner)op.selected=true;ow.appendChild(op)});
      ow.onchange=()=>{r.owner=ow.value;persist()};const td2=el('td');td2.appendChild(ow);tr.appendChild(td2);
      const co=el('input');co.type='number';co.min=0;co.step='any';co.value=r.cost||'';co.placeholder='0';co.oninput=()=>{r.cost=+co.value||0;persist();updateTotals()};
      const td3=el('td');td3.style.width='110px';td3.appendChild(co);tr.appendChild(td3);
      const qt=el('input');qt.type='number';qt.min=0;qt.step='any';qt.value=r.qty;qt.oninput=()=>{r.qty=+qt.value||0;persist();updateTotals()};
      const td4=el('td');td4.style.width='64px';td4.appendChild(qt);tr.appendChild(td4);
      const fr=el('select');g.freqs.forEach(f=>{const op=el('option','',FREQ[f]);op.value=f;if(f===r.freq)op.selected=true;fr.appendChild(op)});
      fr.onchange=()=>{r.freq=fr.value;persist();updateTotals()};const td5=el('td');td5.style.width='110px';td5.appendChild(fr);tr.appendChild(td5);
      const sc=el('select');[['kiosk','Per kiosk'],['flat','Flat']].forEach(([v,l])=>{const op=el('option','',l);op.value=v;if(v===r.scope)op.selected=true;sc.appendChild(op)});
      sc.onchange=()=>{r.scope=sc.value;persist();updateTotals()};const td6=el('td');td6.style.width='100px';td6.appendChild(sc);tr.appendChild(td6);
      const lt=el('td','num');lt.dataset.lt=g.id+':'+idx;tr.appendChild(lt);
      const dx=el('td');const x=el('button','x','\u00d7');x.title='Remove line';x.onclick=()=>{g.rows.splice(idx,1);persist();renderTco()};dx.appendChild(x);tr.appendChild(dx);
      tb.appendChild(tr);
    });
    b.appendChild(tb);
  });

  const reset=el('button','','Reset calculator');reset.onclick=()=>{if(confirm('Reset all TCO inputs?')){delete saved.tco;persist();renderTco();updateTotals()}};
  const tot=el('div','totals');tot.id='totals';b.appendChild(tot);
  const rw=el('div','btnrow');rw.style.marginTop='12px';rw.appendChild(reset);b.appendChild(rw);
  host.appendChild(b);
  document.getElementById('sections').appendChild(host);
  updateTotals();
}

function updateTotals(){
  const T=saved.tco,k=+T.kiosks||0;
  let once=0,annual=0;
  const parts={hw:0,lic:0,sup:0,one:0};
  T.groups.forEach(g=>g.rows.forEach((r,idx)=>{
    const lt=rowTotal(r,k);
    const cell=document.querySelector(`[data-lt="${g.id}:${idx}"]`);
    if(cell)cell.textContent=money(lt)+(r.freq==='once'?'':' / '+r.freq.replace('ly','').replace('annua','year').replace('month','mo').replace('quarter','qtr'));
    if(r.freq==='once')once+=lt;else annual+=lt*ANNUAL_MULT[r.freq];
  }));
  const yrs=+T.years||0;
  const y1=once+annual, term=once+annual*yrs;
  const sell=T.margin>0&&T.margin<100?term/(1-T.margin/100):term;
  const items=[
   ['One-time cost',money(once),false],
   ['Recurring per month',money(annual/12),false],
   ['Recurring per quarter',money(annual/4),false],
   ['Recurring per year',money(annual),false],
   ['Year-1 total',money(y1),false],
   [yrs+'-year TCO',money(term),true],
   ['TCO per kiosk ('+yrs+' yr)',k?money(term/k):'$0',true],
   ['Suggested sell price to PC ('+yrs+' yr)',money(sell),true]
  ];
  const host=document.getElementById('totals');host.innerHTML='';
  items.forEach(([l,v,hl])=>{const t=el('div','tot'+(hl?' hl':''));t.appendChild(el('span','',l));t.appendChild(el('b','',v));host.appendChild(t)});
}

// ---------- wire up ----------
renderSections(); renderTco(); renderNav(); renderChips(); paint();
document.getElementById('q').oninput=e=>{state.q=e.target.value;paint()};
document.getElementById('expand').onclick=()=>document.querySelectorAll('details.sec').forEach(d=>d.open=true);
document.getElementById('collapse').onclick=()=>document.querySelectorAll('details.sec').forEach(d=>d.open=false);
const links=[...document.querySelectorAll('nav a')];
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('active',l.getAttribute('href')==='#'+(e.target.id==='tcoHost'?'tco':e.target.id)))}}),{rootMargin:'-20% 0px -70% 0px'});
document.querySelectorAll('details.sec').forEach(d=>io.observe(d));
</script>
